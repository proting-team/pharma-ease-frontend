services:
  frontend:
    image: pharma-ease:early-frontend
    container_name: pharma-ease-frontend
    build: 
      context: .
      dockerfile: Dockerfile
      target: development
    ports: 
      - "5173:5173"
    volumes:
      - .:/app 
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  server:
    image: pharma-ease-server:latest
    container_name: pharma-ease-production
    build:  
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8080:8080"
