services:
  frontend:
    image: pharma-ease:early-frontend
    container_name: pharma-ease-frontend
    build: 
      context: .
      dockerfile: Dockerfile
    ports: 
      - "5173:5173"
    volumes:
      - .:/app 
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  server:
    image: nginx:alpine3.23
    build:  
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
