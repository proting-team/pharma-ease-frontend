name: Standard CI Job

on:
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting command
        run: npm run lint

      - name: Run Formatting command
        run: npx prettier --check "src/**/*.{ts,vue,css,js}"

      - name: Codebase Formtting and linting checkers
        uses: wearerequired/lint-action@v2
        with:
          eslint: true
          prettier: true

      - name: Run Unit Tests
        run: npm run test:unit -- --run

      - name: Production Build Check
        run: npm run build
