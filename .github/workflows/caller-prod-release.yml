name: Production and Release CI/CD Pipeline

on:
  push:
    branches:
      - 'main'
      - 'production'
    tags:
      - 'v*'

jobs:
  call-standard-ci:
    uses: ./.github/workflows/ci-standard.yml

  call-security-gateways:
    needs: call-standard-ci
    uses: ./.github/workflows/ci-security.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  call-docker-build-push:
    needs: [call-standard-ci, call-security-gateways]
    uses: ./.github/workflows/ci-docker-push.yml
    with:
      image_tag: "early-${{ github.sha }}"
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

  deploy:
    needs: call-docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/pharma-ease-frontend/"

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            mkdir -p ~/pharma-ease-frontend
            cd ~/pharma-ease-frontend

            # Create helper to set env values
            set_env() {
              key=$1
              val=$2
              touch .env
              if grep -q "^${key}=" .env; then
                escaped_val=$(echo "$val" | sed 's/\//\\\//g')
                sed -i "s/^${key}=.*/${key}=${escaped_val}/" .env
              else
                echo "${key}=${val}" >> .env
              fi
            }

            set_env DOCKERHUB_USERNAME "${{ secrets.DOCKER_HUB_USERNAME }}"
            set_env IMAGE_TAG "early-${{ github.sha }}"

            # Authenticate to docker
            docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_TOKEN }}

            # Pull and restart services
            docker compose -f docker-compose.frontend.prod.yml pull
            docker compose -f docker-compose.frontend.prod.yml up -d --remove-orphans
            docker image prune -f


